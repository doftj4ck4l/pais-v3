# Staging-only Pixelbox wiring. The credential values stay on CT 105 under
# /opt/salur/secrets; Compose mounts files, never bearer-token environment data.
services:
  api:
    environment:
      SANDBOX_BACKEND: pixelbox
      MYCIP_SANDBOX_URL: "${MYCIP_SANDBOX_URL:?set MYCIP_SANDBOX_URL in .env}"
      MYCIP_SANDBOX_TOKEN_FILE: /run/secrets/mycip-sandbox/token
      NODE_EXTRA_CA_CERTS: /run/secrets/mycip-sandbox/mycip-sandbox-ca.pem
      SANDBOX_IDLE_MS: "${SANDBOX_IDLE_MS:-3600000}"
    volumes:
      - "${PIXELBOX_SECRETS_ROOT:?set PIXELBOX_SECRETS_ROOT in .env}/token:/run/secrets/mycip-sandbox/token:ro"
      - "${PIXELBOX_SECRETS_ROOT:?set PIXELBOX_SECRETS_ROOT in .env}/mycip-sandbox-ca.pem:/run/secrets/mycip-sandbox/mycip-sandbox-ca.pem:ro"
