name: deploy

# Runner lives on the Forgejo host (CT 100). It cannot build into the deploy
# target, so it tests here, syncs the tree to CT 105, and rebuilds there.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_HOST: 10.92.130.248
  DEPLOY_USER: salur
  DEPLOY_PATH: /opt/salur

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Not `curl https://bun.sh/install | bash`. That script pulls a ~35MB zip
      # from github.com, which is the largest and least reliable fetch in this
      # pipeline: a deploy failed with `curl: (56) Connection died, tried 5
      # times before giving up` while github.com was fully operational and
      # reachable from this very runner a minute later.
      #
      # The same binary is published to npm as a platform package — 2MB, a
      # different host, and an exact version rather than whatever `latest` is
      # today. Unpinning was the quieter bug of the two: CI silently tracked
      # new bun releases, so a green run proved nothing about the next one.
      #
      # curl+tar rather than `npm install -g bun`, so the step needs neither
      # node nor root on the runner.
      - name: Install bun
        env:
          BUN_VERSION: "1.3.14"
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-${BUN_VERSION}.tgz" \
            | tar -xz -C /tmp
          install -D -m755 /tmp/package/bin/bun "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          "$HOME/.bun/bin/bun" --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The sandbox is a remote HTTPS service now (Pixelbox), and every suite
      # drives it through an injected fake — nothing here needs a Docker daemon
      # or the live service, so the whole suite runs and any failure stops the
      # deploy, which is the rule in .claude/skills/deploy.
      - name: Test
        run: |
          cd apps/api
          mapfile -t files < <(find src -name '*.test.ts')
          echo "running ${#files[@]} test files"
          bun test "${files[@]}"

      - name: Test web
        run: bun run --cwd apps/web test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deploy tooling
        run: |
          apt-get update -qq
          apt-get install -y -qq rsync openssh-client curl

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # .env and apps/api/.env hold this host's secrets and are never in git.
      # `secrets` holds mounted Pixelbox credentials; apps/api/data is the live
      # SQLite database; backups holds operator-created recovery snapshots. All
      # five are excluded from --delete as well as from transfer, so a deploy
      # cannot destroy host credentials, live data, or recovery points.
      - name: Sync tree to deploy host
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'apps/api/.env' \
            --exclude 'secrets' \
            --exclude 'apps/api/data' \
            --exclude 'backups' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      # A fresh clone has no apps/api/data. Without it Docker creates the bind
      # mount as root and the API dies with SQLITE_CANTOPEN.
      - name: Ensure data directory exists
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $DEPLOY_PATH/apps/api/data"

      # The sandbox is a remote service (Pixelbox) now, not a local Docker image,
      # so there is no separate sandbox image to build out-of-band any more — just
      # the Compose stack (api + web).
      #
      # --build is not optional: without it compose reuses the previous image and
      # "deployed" silently means "restarted the old code".
      - name: Build and restart
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && \
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build"

      # /api/meta proves three things at once: Caddy is up, the proxy reaches
      # the API, and the API finished ensureSchema().
      - name: Verify
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8080/api/meta || true)
              if [ "$code" = "200" ]; then echo "/api/meta OK after $((i*3))s"; exit 0; fi
              sleep 3
            done
            echo "API did not answer within 90s"
            cd '"$DEPLOY_PATH"' && docker compose ps && docker compose logs api --tail 40
            exit 1'
