name: deploy

# Runner lives on the Forgejo host (CT 100). It cannot build into the deploy
# target, so it tests here, syncs the tree to CT 105, and rebuilds there.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_HOST: 10.0.152.105
  DEPLOY_USER: salur
  DEPLOY_PATH: /opt/salur

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Not `curl https://bun.sh/install | bash`. That script pulls a ~35MB zip
      # from github.com, which is the largest and least reliable fetch in this
      # pipeline: a deploy failed with `curl: (56) Connection died, tried 5
      # times before giving up` while github.com was fully operational and
      # reachable from this very runner a minute later.
      #
      # The same binary is published to npm as a platform package — 2MB, a
      # different host, and an exact version rather than whatever `latest` is
      # today. Unpinning was the quieter bug of the two: CI silently tracked
      # new bun releases, so a green run proved nothing about the next one.
      #
      # curl+tar rather than `npm install -g bun`, so the step needs neither
      # node nor root on the runner.
      - name: Install bun
        env:
          BUN_VERSION: "1.3.14"
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-${BUN_VERSION}.tgz" \
            | tar -xz -C /tmp
          install -D -m755 /tmp/package/bin/bun "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          "$HOME/.bun/bin/bun" --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The sandbox suites drive a real Docker daemon and fail without one.
      # They are excluded here rather than ignored, so any *other* failure
      # still stops the deploy — which is the rule in .claude/skills/deploy.
      - name: Test
        run: |
          cd apps/api
          mapfile -t files < <(find src -name '*.test.ts' \
            ! -name 'docker.test.ts' \
            ! -name 'docker-execution-env.test.ts' \
            ! -name 'sandbox.service.test.ts')
          echo "running ${#files[@]} test files"
          bun test "${files[@]}"

      - name: Test web
        run: |
          bun run --cwd apps/web test
          bun run --cwd apps/web build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deploy tooling
        run: |
          apt-get update -qq
          apt-get install -y -qq rsync openssh-client curl

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # .env and apps/api/.env hold this host's secrets and are never in git.
      # `secrets` holds host-only credentials; apps/api/data is the live SQLite
      # database; backups holds operator-created recovery snapshots. All five
      # are excluded from --delete as well as from transfer, so a deploy cannot
      # destroy host credentials, live data, or recovery points.
      - name: Sync tree to deploy host
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.worktrees' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --include '.env.example' \
            --exclude '.env.*' \
            --exclude 'apps/api/.env' \
            --exclude 'secrets' \
            --exclude 'apps/api/data' \
            --exclude 'backups' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      # A fresh clone has no apps/api/data. Without it Docker creates the bind
      # mount as root and the API dies with SQLITE_CANTOPEN.
      - name: Ensure data directory exists
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $DEPLOY_PATH/apps/api/data"

      # Two builds, because the sandbox image is not a Compose service — it is
      # built out-of-band (the installer's refresh_stack does the same). Without
      # this, `compose up --build` refreshes api/web but the sandbox keeps its
      # old image, so sandbox-side changes (its toolchain: bash, curl,
      # ghostscript, PDF libs, pip) silently never ship on a CI deploy.
      #
      # --build on the compose step is not optional either: without it compose
      # reuses the previous image and "deployed" silently means "restarted the
      # old code".
      - name: Build and restart
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && \
            img=\$(grep -m1 '^SANDBOX_IMAGE=' .env 2>/dev/null | cut -d= -f2- | tr -d '\"' || true) && \
            docker build -t \"\${img:-pixelspace-sandbox:1}\" -f apps/api/sandbox/Dockerfile apps/api/sandbox && \
            docker compose up -d --build"

      # /api/meta proves three things at once: Caddy is up, the proxy reaches
      # the API, and the API finished ensureSchema().
      - name: Verify
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8080/api/meta || true)
              if [ "$code" = "200" ]; then echo "/api/meta OK after $((i*3))s"; exit 0; fi
              sleep 3
            done
            echo "API did not answer within 90s"
            cd '"$DEPLOY_PATH"' && docker compose ps && docker compose logs api --tail 40
            exit 1'

  # The node1 installation is installer-managed: its database, workspaces,
  # application env and backups all live outside the synced checkout. Keep it
  # as a separate job so a host-specific failure is named plainly in Forgejo
  # and cannot change the long-running staging target's deployment settings.
  deploy-node1:
    needs: test
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: 10.0.151.9
      DEPLOY_USER: node1
      DEPLOY_PATH: /home/node1/Developer/pixelspacev3
      DEPLOY_PORT: "18080"
    steps:
      - uses: actions/checkout@v4

      - name: Install deploy tooling
        run: |
          apt-get update -qq
          apt-get install -y -qq rsync openssh-client curl

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify deploy host
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "test -f $DEPLOY_PATH/.env && \
            test -w $DEPLOY_PATH && \
            docker ps >/dev/null && \
            cd $DEPLOY_PATH && docker compose config -q"

      # Host configuration and all mutable state stay where the installer put
      # them. The checkout is disposable deployment input.
      - name: Sync tree to node1
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.worktrees' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --include '.env.example' \
            --exclude '.env.*' \
            --exclude 'apps/api/.env' \
            --exclude 'secrets' \
            --exclude 'apps/api/data' \
            --exclude 'backups' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      # `upgrade` validates the host, creates a consistent recovery backup,
      # rebuilds API/web/sandbox, recreates the stack, and waits for health.
      - name: Back up, build and restart node1
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && scripts/pixelspace upgrade --yes"

      - name: Verify node1
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:'"$DEPLOY_PORT"'/api/meta || true)
              if [ "$code" = "200" ]; then echo "/api/meta OK after $((i*3))s"; exit 0; fi
              sleep 3
            done
            echo "API did not answer within 90s"
            cd '"$DEPLOY_PATH"' && docker compose ps && docker compose logs api --tail 40
            exit 1'
