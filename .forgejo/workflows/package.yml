name: package

# Build self-contained offline install bundles for every supported architecture
# and attach them to a Forgejo release. An operator then installs on a fresh host
# from one archive — no repository clone. See `scripts/pixelspace package` and
# ON_PREM.md.
#
# The VERSION file is the single source of the version, and the git tag is
# derived from it — nobody tags by hand:
#   * push to main  → if VERSION names a version with no release yet, cut it
#   * push tag v*    → (re)build that tag
#   * manual run     → build the given tag, or VERSION if none is given
#
# Both bundles build on one amd64 runner: amd64 natively, arm64 under QEMU via a
# buildx container builder (a plain builder does not apply the emulator to build
# steps). Emulated arm64 builds are slow; if that is a problem, register an arm64
# host (e.g. a DGX Spark) as a runner and switch the arm64 matrix leg to
# `runs-on: arm64` — the steps are identical and it builds natively.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (default: the VERSION file)"
        required: false
      with_model:
        description: "Include the large DGX model image"
        type: boolean
        default: false

jobs:
  # Resolve the version, decide whether a release is due, and create it once so
  # the per-arch jobs only upload.
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan the release
        id: plan
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          case "${{ github.ref }}" in
            refs/tags/*) v="${GITHUB_REF_NAME#v}" ;;
            *) v="${INPUT_TAG#v}"; [ -n "$v" ] || v="$(cat VERSION)" ;;
          esac
          tag="v$v"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          api="$SERVER/api/v1/repos/$REPO"; auth="Authorization: token $TOKEN"
          exists=no
          curl -fsS -H "$auth" "$api/releases/tags/$tag" >/dev/null 2>&1 && exists=yes

          # A plain push to main with a VERSION that is already released is a
          # no-op; a tag push or manual run always (re)builds.
          if [ "$exists" = yes ] && [ "${{ github.ref }}" != "refs/tags/$tag" ] \
             && [ "${{ github.event_name }}" != workflow_dispatch ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "release $tag already exists; nothing to build"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

          if [ "$exists" = no ]; then
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' "$api/releases" \
              -d "{\"tag_name\":\"$tag\",\"name\":\"$tag\",\"body\":\"Offline install bundles. See ON_PREM.md.\"}" >/dev/null
            echo "created release $tag"
          fi

  bundle:
    needs: release
    if: needs.release.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      # binfmt so this amd64 runner can execute arm64 build steps. amd64: skipped.
      - name: Enable emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      # A container-driver builder is what actually applies the emulator to the
      # build (the default builder does not) and lets --load stage the result.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      # The tag is the version: stamp it into VERSION so the images carry it.
      - name: Stamp the version
        run: |
          v="${{ needs.release.outputs.tag }}"
          printf '%s\n' "${v#v}" > VERSION
          echo "building ${v#v} for ${{ matrix.arch }}"

      - name: Build the bundle
        id: build
        env:
          PIXELSPACE_ARCH_OVERRIDE: ${{ matrix.arch }}
          PIXELSPACE_BUILD_PLATFORM: linux/${{ matrix.arch }}
        run: |
          args=(package --output "$PWD/dist")
          [ "${{ github.event.inputs.with_model }}" = "true" ] && args+=(--with-model)
          mkdir -p dist
          scripts/pixelspace "${args[@]}"
          archive="$(ls dist/pixelspace-*-${{ matrix.arch }}.tar.gz | head -1)"
          [ -n "$archive" ] || { echo "no ${{ matrix.arch }} bundle produced"; exit 1; }
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$archive")" >> "$GITHUB_OUTPUT"
          ls -lh "$archive"

      - name: Attach to the release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          ARCHIVE: ${{ steps.build.outputs.archive }}
          NAME: ${{ steps.build.outputs.name }}
        run: |
          set -euo pipefail
          api="$SERVER/api/v1/repos/$REPO"; auth="Authorization: token $TOKEN"
          id="$(curl -fsS -H "$auth" "$api/releases/tags/$TAG" | jq -r '.id')"
          [ -n "$id" ] && [ "$id" != null ] || { echo "release $TAG not found"; exit 1; }
          old="$(curl -fsS -H "$auth" "$api/releases/$id/assets" \
            | jq -r --arg n "$NAME" '.[] | select(.name==$n) | .id')"
          [ -z "$old" ] || curl -fsS -X DELETE -H "$auth" "$api/releases/$id/assets/$old"
          curl -fsS -X POST -H "$auth" \
            -F "attachment=@$ARCHIVE;type=application/gzip" \
            "$api/releases/$id/assets?name=$NAME"
          echo "Attached $NAME to $TAG."
