<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Work alongside local agents: give one a task, watch it run step by step, keep the results."
    />
    <title>PixelSpace — local agent cowork</title>
    <script>
      // Paint the right ground colour on the first frame, before React mounts.
      (function () {
        try {
          // Falls back through the pre-rebrand keys so the first paint after an
          // upgrade still matches the theme the user had chosen.
          var saved =
            localStorage.getItem('pixelspace-theme') ||
            localStorage.getItem('salurai-theme') ||
            localStorage.getItem('mixmatch-theme')
          var dark = saved === 'dark'
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
