# Pixelspace, deployed on this host.
#
# Two services. `web` is the only one published: Caddy serves the built console
# and proxies /api to `api` over the compose network, so the API has no host
# port at all. It has no authentication, and a port is an invitation.
#
# The API talks to the host's Docker daemon through a bind-mounted socket, and
# starts each workspace's sandbox as a *sibling* container. That is why three
# paths below are mounted at identical host and container paths: `docker run -v
# <p>:<p>` is resolved by the daemon on the host, so a path this container names
# has to mean the same thing there.
#
# Socket access is root-equivalent on the host. This is a deliberate trade for
# real per-workspace isolation; see README under "Deploying".

# Left at the old name deliberately: the compose project name is what the
# running containers and the `rustfs` named volume are keyed by. Renaming it
# starts a second, empty stack and orphans the volume every generated image
# lives in. Renaming it is a migration, not an edit.
name: salurai

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # uid 1000 so files written into the workspace and data mounts belong to the
    # host user, not root. The supplementary group is the host's `docker` group,
    # which is what makes the bind-mounted socket readable.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-999}"
    # Two files, in precedence order. The root `.env` carries deployment
    # config; `apps/api/.env` carries the application's own secrets and is the
    # same file `bun dev` reads, so a key added for development is not silently
    # absent from the deployment. Later file wins, and it is optional — a fresh
    # checkout that has only the root `.env` still boots.
    env_file:
      - path: .env
      - path: apps/api/.env
        required: false
    environment:
      PORT: "4000"
      SANDBOX_BACKEND: docker
      SANDBOX_IMAGE: "${SANDBOX_IMAGE:-pixelspace-sandbox:1}"
      # Both must be host paths, mounted below at the same path inside.
      SANDBOX_ROOT: "${SANDBOX_ROOT:?set SANDBOX_ROOT in .env}"
      SKILLS_ROOT: "${REPO_ROOT:?set REPO_ROOT in .env}/apps/api/skills"
      # Generated media. `rustfs` is the compose service name, so this only
      # resolves on the compose network — the bucket is not reachable from the
      # host, by design. `bun dev` needs S3_ENDPOINT=http://localhost:9000 in
      # apps/api/.env to reach the published port instead.
      S3_ENDPOINT: "http://rustfs:9000"
      S3_BUCKET: "${S3_BUCKET:-salur-media}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-rustfsadmin}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Workspaces: written by this container, bind-mounted by sandbox siblings.
      - "${SANDBOX_ROOT}:${SANDBOX_ROOT}"
      # Skills: read by this container to build the prompt, mounted read-only
      # into every sandbox. Read-only here too — the agent cannot rewrite the
      # code it is about to run.
      - "${REPO_ROOT}/apps/api/skills:${REPO_ROOT}/apps/api/skills:ro"
      # SQLite lives on the host so a rebuild does not discard conversations,
      # workspaces, documents, or MCP servers.
      - "${REPO_ROOT}/apps/api/data:/app/apps/api/data"
      # uvx / npx package cache. Without it every deploy re-downloads every
      # stdio MCP server on its first call, which reads as a hang.
      - mcp-cache:/cache
    depends_on:
      rustfs:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:4000/api/meta')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # S3-compatible object storage for generated images. Unpublished like `api`:
  # the only thing that talks to it is the API, which re-serves objects through
  # /api/images/:id so a link in a transcript never expires and the bucket
  # credentials never leave the compose network.
  rustfs:
    image: rustfs/rustfs:latest
    # Deliberately NOT pinned to HOST_UID the way `api` is. `api` needs it
    # because it writes into bind mounts the host user must own; rustfs owns a
    # named volume that nothing outside the container ever opens by path. The
    # override was tried and the image refuses to start under it: /data and
    # /logs belong to the image's own `rustfs` user, so uid 1000 gets
    # "Local disk initialization failed ... Permission denied (os error 13)".
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY:-rustfsadmin}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}"
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  mcp-cache:
  # Generated images. A named volume rather than a bind mount: nothing outside
  # RustFS reads these files by path, so there is no reason to pin them to a
  # host directory the way SANDBOX_ROOT has to be.
  rustfs-data:
